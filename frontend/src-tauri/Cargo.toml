[package]
name = "parade"
version = "0.2.0"
description = "Decentralized P2P chat and file sharing"
authors = ["Parade Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
anyhow = "1"
dirs = "6"
once_cell = "1"

[lib]
name = "parade_lib"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "parade_tauri"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
