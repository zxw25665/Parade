syntax = "proto3";

package parade.chat.v1;

option go_package = "parade/internal/network/pb/chatpb;chatpb";

message Envelope {
  string sender_id   = 1;
  bytes  payload     = 2;
  string signature   = 3;
  int32  type        = 4;  // 0=team, 1=private, 2=file-browse-req, 3=file-browse-resp,
                            // 4=file-meta-req, 5=file-meta-resp, 6=file-download-req, 
                            // 7=file-chunk, 8=peer-info-exchange, 9=heartbeat, 99=test
  string receiver_id = 5;  // empty for team, target pubkey for private
  string team_id      = 6;  // team scope identifier, empty for default team
  string channel_id   = 7;  // empty for team-wide, channel ID for channel messages
}

message MetadataSyncRequest {
  string sender_id = 1;
  int64 hlc = 2;
}

message MetadataSyncResponse {
  string sender_id = 1;
  int64 hlc = 2;
  bytes payload = 3;
}

message HandshakeRequest {
  string sender_id = 1;
  bytes team_challenge = 2;
}

message HandshakeResponse {
  string remote_pubkey = 1;
  bool team_match = 2;
  bytes team_reply = 3;
}

service ChatService {
  rpc StreamChat(stream Envelope) returns (stream Envelope);
  rpc SyncMetadata(stream MetadataSyncRequest) returns (stream MetadataSyncResponse);
  rpc Handshake(HandshakeRequest) returns (HandshakeResponse);
}
