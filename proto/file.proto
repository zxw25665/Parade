syntax = "proto3";

package parade.file.v1;

option go_package = "parade/internal/network/pb;pb";

message FileRequest {
  string task_id = 1;
  string peer_id = 2;
  string file_path = 3;
  int64 offset = 4;
  int32 chunk_size = 5;
  string team_id = 6;
}

message FileChunk {
  string task_id = 1;
  string peer_id = 2;
  string file_path = 3;
  int64 offset = 4;
  bytes data = 5;
  int64 total_size = 6;
  bool eof = 7;
  string file_hash = 8;
}

message FileMetaRequest {
  string peer_id = 1;
  string file_path = 2;
  string team_id = 3;
}

message FileMetaResponse {
  string file_path = 1;
  int64 total_size = 2;
  string file_hash = 3;
  int64 chunk_size = 4;
}

message BrowseRequest {
  string peer_id = 1;
  string path = 2;        // directory path to browse (empty = root of shared dirs)
  string team_id = 3;
}

message BrowseEntry {
  string name = 1;
  string path = 2;
  bool is_directory = 3;
  int64 size = 4;
  string hash = 5;
}

message BrowseResponse {
  string path = 1;
  repeated BrowseEntry entries = 2;
}

service FileTransferService {
  rpc DownloadFile(FileRequest) returns (stream FileChunk);
  rpc GetFileMeta(FileMetaRequest) returns (FileMetaResponse);
  rpc BrowseDirectory(BrowseRequest) returns (BrowseResponse);
}